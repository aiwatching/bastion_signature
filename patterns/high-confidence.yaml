# High-confidence patterns: very low false positive rate
# These patterns match well-known credential/token formats with distinctive prefixes.

patterns:
  # ── Cloud Provider Keys ──

  - name: aws-access-key
    category: high-confidence
    regex: '(?<![A-Z0-9])AKIA[0-9A-Z]{16}(?![A-Z0-9])'
    flags: g
    description: AWS Access Key ID
    contextVerify:
      confirmPatterns:
        - '(?:aws|amazon|iam|access.?key|secret.?key|credential)'

  - name: aws-secret-key
    category: high-confidence
    regex: '(?<![A-Za-z0-9/+=_-])[A-Za-z0-9/+=]{40}(?![A-Za-z0-9/+=_-])'
    flags: g
    description: AWS Secret Access Key (40-char base64)
    requireContext:
      - aws
      - secret
      - AWS_SECRET
    contextVerify:
      minEntropy: 3.5

  - name: azure-openai-api-key
    category: high-confidence
    regex: '(?<![A-Za-z0-9_-])[a-f0-9]{32}(?![A-Za-z0-9_-])'
    flags: g
    description: Azure OpenAI API Key (32-char hex)
    requireContext:
      - azure
      - AZURE_OPENAI
      - openai.azure.com
    contextVerify:
      minEntropy: 3.5

  # ── Code Hosting / DevOps ──

  - name: github-token
    category: high-confidence
    regex: 'ghp_[A-Za-z0-9]{36}'
    flags: g
    description: GitHub Personal Access Token

  - name: github-fine-grained-token
    category: high-confidence
    regex: 'github_pat_[A-Za-z0-9]{22}_[A-Za-z0-9]{59}'
    flags: g
    description: GitHub Fine-grained PAT

  # ── Messaging / Communication ──

  - name: slack-token
    category: high-confidence
    regex: 'xox[bporas]-[0-9]{10,13}-[A-Za-z0-9-]{20,}'
    flags: g
    description: Slack Token (bot, user, app, workspace)

  - name: slack-app-token
    category: high-confidence
    regex: 'xapp-[0-9]+-[A-Za-z0-9]+-[0-9]+-[A-Za-z0-9]+'
    flags: g
    description: Slack App-Level Token

  - name: slack-config-token
    category: high-confidence
    regex: 'xoxe(?:\.xox[bp])?-[0-9]+-[A-Za-z0-9-]+'
    flags: g
    description: Slack Configuration / Refresh Token

  - name: slack-webhook-url
    category: high-confidence
    regex: 'https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+'
    flags: g
    description: Slack Incoming Webhook URL

  - name: wechat-appid
    category: high-confidence
    regex: '(?<![A-Za-z0-9])wx[a-f0-9]{16}(?![A-Za-z0-9])'
    flags: g
    description: WeChat AppID (公众号/小程序)

  - name: wechat-appsecret
    category: high-confidence
    regex: '(?<![A-Za-z0-9_-])[a-f0-9]{32}(?![A-Za-z0-9_-])'
    flags: g
    description: WeChat AppSecret (32-char hex)
    requireContext:
      - wechat
      - weixin
      - 微信
      - appsecret
      - WECHAT_SECRET
      - WECHAT_APP_SECRET
      - wx_secret

  - name: telegram-bot-token
    category: high-confidence
    regex: '\b\d{8,10}:AA[A-Za-z0-9_-]{33,35}\b'
    flags: g
    description: Telegram Bot Token

  # ── Payment ──

  - name: stripe-secret-key
    category: high-confidence
    regex: 'sk_live_[A-Za-z0-9]{24,}'
    flags: g
    description: Stripe Secret Key

  # ── Cryptographic ──

  - name: private-key
    category: high-confidence
    regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
    flags: g
    description: Private Key Header

  # ── LLM Provider API Keys ──

  - name: openai-api-key
    category: high-confidence
    regex: 'sk-(?!ant-)[A-Za-z0-9_-]{40,}'
    flags: g
    description: OpenAI API Key (also matches DeepSeek, Moonshot, Tongyi, and other sk- prefixed keys)
    contextVerify:
      confirmPatterns:
        - '(?:api|key|token|secret|openai|deepseek|moonshot|credential|bearer)'
      minEntropy: 3.5

  - name: anthropic-api-key
    category: high-confidence
    regex: 'sk-ant-[A-Za-z0-9_-]{36,}'
    flags: g
    description: Anthropic API Key

  - name: google-ai-api-key
    category: high-confidence
    regex: 'AIzaSy[A-Za-z0-9_-]{33}'
    flags: g
    description: Google AI / Gemini API Key

  - name: huggingface-token
    category: high-confidence
    regex: 'hf_[A-Za-z0-9]{20,}'
    flags: g
    description: Hugging Face Access Token

  - name: replicate-api-token
    category: high-confidence
    regex: 'r8_[A-Za-z0-9]{37,}'
    flags: g
    description: Replicate API Token

  - name: groq-api-key
    category: high-confidence
    regex: 'gsk_[A-Za-z0-9]{48,}'
    flags: g
    description: Groq API Key

  - name: perplexity-api-key
    category: high-confidence
    regex: 'pplx-[A-Za-z0-9]{48,}'
    flags: g
    description: Perplexity API Key

  - name: xai-api-key
    category: high-confidence
    regex: 'xai-[A-Za-z0-9]{48,}'
    flags: g
    description: xAI (Grok) API Key

  - name: cohere-api-key
    category: high-confidence
    regex: '(?<![A-Za-z0-9_-])[A-Za-z0-9]{40}(?![A-Za-z0-9_-])'
    flags: g
    description: Cohere / Mistral / Together AI API Key (40-char token)
    requireContext:
      - cohere
      - CO_API_KEY
      - mistral
      - MISTRAL_API_KEY
      - together
      - TOGETHER_API_KEY
    contextVerify:
      minEntropy: 3.5

  # ── Search / Browser ──

  - name: brave-api-key
    category: high-confidence
    regex: 'BSA[A-Za-z0-9_-]{20,}'
    flags: g
    description: Brave Search API Key

  # ── Generic Secret Assignment ──

  - name: password-assignment
    category: high-confidence
    regex: '(?:password|passwd|pwd|pass_?word|secret_?key|auth_?token|access_?token|api_?key|apikey|\bkey\b|_key|_secret|_token|credential)[\s]*[=:]\s*[''"]?([^\s''"]{6,})'
    flags: gi
    description: Password or secret assignment (key=value pattern)
    contextVerify:
      antiPatterns:
        - '(?:example|placeholder|your[_-]?|xxx|test[_-]?|sample|dummy|changeme)'
